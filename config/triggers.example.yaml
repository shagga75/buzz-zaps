# buzz-zaps trigger config
#
# Fase 1 (implementada): el comando manual /zap está hardcodeado en
# src/bot/command-parser.ts — no lee `triggers` acá abajo. Se documenta
# igual para dejar la forma consistente con Fase 2.
#
# Fase 2 (implementada): `reaction_added` sí se lee en tiempo real por
# src/bot/reaction-flow.ts. Cuando alguien reacciona con `emoji` a un
# mensaje, se zapea `amount_sats` al autor de ese mensaje — pero solo si
# ese autor corrió antes `/link <su-username-de-lawallet>` en el canal
# (ver README "Fase 2" para por qué hace falta ese paso).
#
# Evaluamos delegarle este trigger a los workflows YAML nativos de Buzz
# (`on: reaction_added` + acción `call_webhook`, crates/buzz-workflow/src/schema.rs)
# en vez de escucharlo acá — por ahora se implementó como extensión del
# mismo listener que ya usa Fase 1, así queda autocontenido en este repo.

community: buzz-zaps-test

triggers:
  - on: manual_zap_command
    command: /zap

  - on: reaction_added
    emoji: "🐝"
    amount_sats: 21
