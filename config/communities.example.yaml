# buzz-zaps community config
#
# One process, N communities. A Buzz "community" is resolved server-side
# from the connection's Host header (TenantContext in
# crates/buzz-core/src/tenant.rs, confirmed reading it before designing this
# — it's a deliberate multi-tenant fence, not something a client picks). So
# each entry below opens its own relay connection and can point at its own
# LaWallet instance: `relay_url` and `lawallet_base_url` are per-community,
# never global env vars. BUZZ_BOT_NSEC (in .env) is the one thing shared —
# the same bot identity authenticates against every community's relay.
#
# Fase 1 (implementada): el comando manual /zap está hardcodeado en
# src/bot/command-parser.ts — no lee `triggers` acá abajo. Se documenta
# igual para dejar la forma consistente con Fase 2.
#
# Fase 2 (implementada): `reaction_added` sí se lee en tiempo real por
# src/bot/reaction-flow.ts. Cuando alguien reacciona con `emoji` a un
# mensaje, se zapea `amount_sats` al autor de ese mensaje — pero solo si
# ese autor corrió antes `/link <su-username-de-lawallet>` en el canal
# (ver README "Fase 2" para por qué hace falta ese paso).
#
# Evaluamos delegarle este trigger a los workflows YAML nativos de Buzz
# (`on: reaction_added` + acción `call_webhook`, crates/buzz-workflow/src/schema.rs)
# en vez de escucharlo acá — por ahora se implementó como extensión del
# mismo listener que ya usa Fase 1, así queda autocontenido en este repo.
#
# `agent_task_completed` (implementada): buzz's own kind:46001-46012
# workflow-lifecycle events and kind:43001-43006 agent-job-protocol events
# are reserved in crates/buzz-core/src/kind.rs but nothing in buzz-relay
# actually publishes them yet (confirmed reading command_executor.rs and
# buzz-workflow's executor.rs — only KIND_WORKFLOW_DEF/TRIGGER are handled).
# So there's no real "task completed" Nostr event to listen for today. This
# trigger instead fires on the one thing that IS real: an agent (any pubkey
# with a kind:10100 AGENT_PROFILE) posting a NIP-10 reply to a human's
# message. `service_username` is buzz-zaps' own LaWallet address (not the
# invoking human's) — see README "Fase 2 — cobro automático" for why this is
# a charge *request*, not an auto-debit.

communities:
  - name: buzz-zaps-test
    relay_url: ws://localhost:3000
    channel_id: bd05a9e5-a869-450a-9e22-5b5705c6a714
    lawallet_base_url: http://localhost:2288

    triggers:
      - on: manual_zap_command
        command: /zap

      - on: reaction_added
        emoji: "🐝"
        amount_sats: 21

      - on: agent_task_completed
        amount_sats: 50
        service_username: buzz-zaps-service

  # Add a second (third, ...) entry here to serve another community from
  # this same process — each gets its own relay connection, LaWallet
  # instance, triggers, and SQLite file, with no state shared between them
  # except the bot's Nostr identity (BUZZ_BOT_NSEC). See README "Fase 2 —
  # wallets por comunidad" for a worked example and how it was live-tested.
